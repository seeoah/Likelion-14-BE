{% extends 'base.html' %} {% block title %}Sign Up{% endblock %} 
{% block content %}
<h1>회원가입</h1>
<form action="{% url 'accounts:signup' %}" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div>{{ form.as_p }}</div>
    <div>
        <input type = "submit">
    </div>
</form>
{% endblock %}
